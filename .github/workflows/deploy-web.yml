name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/yunnan-intangible-culture/"

      - name: Copy build output to docs/
        run: |
          # 临时保存项目文档
          mv docs/images /tmp/images 2>/dev/null || true
          mv docs/report-figures /tmp/report-figures 2>/dev/null || true
          # 清空 docs/
          rm -rf docs/*
          # 恢复项目文档
          mv /tmp/images docs/images 2>/dev/null || true
          mv /tmp/report-figures docs/report-figures 2>/dev/null || true
          # 将 build/web 内容复制到 docs/ 根
          cp -r build/web/* docs/
          touch docs/.nojekyll

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: 更新 Flutter Web 构建产物" || exit 0
          git push
