<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#F1DEC0"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54281D"/><stop offset="1" stop-color="#A7442B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6C351F" flood-opacity=".15"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2L10 6L2 10Z" fill="#8F3E26"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:34px;font-weight:800;fill:#4B2419}
      .sub{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;fill:#7B5946}
      .stage{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:22px;font-weight:800;fill:#4B2419}
      .desc{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:14px;fill:#6C4D3B}
      .white{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:17px;font-weight:800;fill:#fff}
      .smallw{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:13px;fill:#FFE8BF}
    </style>
  </defs>
  <rect width="1200" height="640" rx="34" fill="url(#bg)"/>
  <text x="600" y="66" text-anchor="middle" class="title">云南地图交互流程</text>
  <text x="600" y="96" text-anchor="middle" class="sub">从 GeoJSON 加载到州市点击，再到非遗信息面板呈现，形成空间化内容浏览体验</text>

  <g filter="url(#shadow)">
    <rect x="78" y="160" width="214" height="168" rx="28" fill="#FFFDF8" stroke="#D7B06E"/>
    <circle cx="122" cy="204" r="24" fill="#8F3E26"/><text x="122" y="212" text-anchor="middle" class="white">01</text>
    <text x="185" y="202" text-anchor="middle" class="stage">数据加载</text>
    <text x="185" y="240" text-anchor="middle" class="desc">请求阿里云 DataV</text>
    <text x="185" y="264" text-anchor="middle" class="desc">云南州市 GeoJSON</text>
    <rect x="112" y="286" width="146" height="28" rx="14" fill="#FFF1D7"/>
    <text x="185" y="305" text-anchor="middle" class="desc">http 网络请求</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="362" y="160" width="214" height="168" rx="28" fill="#FFFDF8" stroke="#D7B06E"/>
    <circle cx="406" cy="204" r="24" fill="#A7442B"/><text x="406" y="212" text-anchor="middle" class="white">02</text>
    <text x="469" y="202" text-anchor="middle" class="stage">地图绘制</text>
    <text x="469" y="240" text-anchor="middle" class="desc">解析多边形坐标</text>
    <text x="469" y="264" text-anchor="middle" class="desc">绘制州市区域轮廓</text>
    <rect x="396" y="286" width="146" height="28" rx="14" fill="#FFF1D7"/>
    <text x="469" y="305" text-anchor="middle" class="desc">CustomPainter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="646" y="160" width="214" height="168" rx="28" fill="#FFFDF8" stroke="#D7B06E"/>
    <circle cx="690" cy="204" r="24" fill="#B7462A"/><text x="690" y="212" text-anchor="middle" class="white">03</text>
    <text x="753" y="202" text-anchor="middle" class="stage">区域点击</text>
    <text x="753" y="240" text-anchor="middle" class="desc">判断命中州市区域</text>
    <text x="753" y="264" text-anchor="middle" class="desc">更新选中状态高亮</text>
    <rect x="680" y="286" width="146" height="28" rx="14" fill="#FFF1D7"/>
    <text x="753" y="305" text-anchor="middle" class="desc">用户交互</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="160" width="214" height="168" rx="28" fill="#FFFDF8" stroke="#D7B06E"/>
    <circle cx="974" cy="204" r="24" fill="#5B2B20"/><text x="974" y="212" text-anchor="middle" class="white">04</text>
    <text x="1037" y="202" text-anchor="middle" class="stage">信息呈现</text>
    <text x="1037" y="240" text-anchor="middle" class="desc">匹配 RegionInfo</text>
    <text x="1037" y="264" text-anchor="middle" class="desc">展示项目与文化标签</text>
    <rect x="964" y="286" width="146" height="28" rx="14" fill="#FFF1D7"/>
    <text x="1037" y="305" text-anchor="middle" class="desc">详情面板</text>
  </g>

  <path d="M294 244H354" stroke="#8F3E26" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M578 244H638" stroke="#8F3E26" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M862 244H922" stroke="#8F3E26" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="188" y="410" width="824" height="100" rx="28" fill="url(#dark)"/>
    <text x="238" y="452" class="white">容错策略</text>
    <text x="238" y="482" class="smallw">当 GeoJSON 请求失败或网络不可用时，组件自动展示本地备用地图，保证页面结构完整。</text>
    <path d="M826 458C852 428 896 428 922 458C896 488 852 488 826 458Z" fill="#FFE1AE" opacity=".9"/>
    <circle cx="874" cy="458" r="12" fill="#8F3E26"/>
  </g>

  <text x="600" y="568" text-anchor="middle" class="sub">交互价值：用户不只是在阅读非遗资料，而是在云南地域空间中主动定位和发现文化内容。</text>
</svg>
