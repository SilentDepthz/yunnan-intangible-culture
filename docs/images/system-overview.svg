<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#F1DEC0"/>
    </linearGradient>
    <linearGradient id="hero" x1="135" y1="78" x2="1065" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54281D"/>
      <stop offset="1" stop-color="#A7442B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6C351F" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:34px;font-weight:800;fill:#fff}
      .subtitle{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;fill:#FFE8BF}
      .label{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:21px;font-weight:800;fill:#4B2419}
      .small{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:14px;fill:#7B5946}
      .tag{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:13px;font-weight:700;fill:#8F3E26}
      .num{font-family:Georgia,serif;font-size:28px;font-weight:700;fill:#B7462A}
    </style>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1082" cy="96" r="90" fill="#E9C98D" opacity=".26"/>
  <circle cx="136" cy="632" r="120" fill="#B7462A" opacity=".08"/>
  <path d="M76 192C236 140 357 244 502 206C707 152 828 212 1124 176" stroke="#D7A55F" stroke-width="2" opacity=".45"/>

  <rect x="135" y="72" width="930" height="108" rx="30" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="600" y="119" text-anchor="middle" class="title">云南非遗文化数字展示平台</text>
  <text x="600" y="150" text-anchor="middle" class="subtitle">以地图为入口，以项目为内容，以故事和游戏增强文化传播体验</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="196" height="158" rx="24" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="178" y="296" text-anchor="middle" class="label">首页聚合</text>
    <text x="178" y="330" text-anchor="middle" class="small">主题视觉 · 推荐轮播</text>
    <text x="178" y="356" text-anchor="middle" class="small">非遗地图 · 数据概览</text>
    <rect x="123" y="376" width="110" height="28" rx="14" fill="#FFF1D7"/>
    <text x="178" y="395" text-anchor="middle" class="tag">HomePage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="250" width="196" height="158" rx="24" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="408" y="296" text-anchor="middle" class="label">非遗项目</text>
    <text x="408" y="330" text-anchor="middle" class="small">搜索 · 分类筛选</text>
    <text x="408" y="356" text-anchor="middle" class="small">详情 · 流程 · 价值</text>
    <rect x="347" y="376" width="122" height="28" rx="14" fill="#FFF1D7"/>
    <text x="408" y="395" text-anchor="middle" class="tag">CulturePage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="250" width="196" height="158" rx="24" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="638" y="296" text-anchor="middle" class="label">传承故事</text>
    <text x="638" y="330" text-anchor="middle" class="small">传承人 · 成就资料</text>
    <text x="638" y="356" text-anchor="middle" class="small">非遗故事时间线</text>
    <rect x="570" y="376" width="136" height="28" rx="14" fill="#FFF1D7"/>
    <text x="638" y="395" text-anchor="middle" class="tag">InheritorPage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="250" width="196" height="158" rx="24" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="868" y="296" text-anchor="middle" class="label">互动体验</text>
    <text x="868" y="330" text-anchor="middle" class="small">拼图 · 配对</text>
    <text x="868" y="356" text-anchor="middle" class="small">工坊 · 古道寻踪</text>
    <rect x="795" y="376" width="146" height="28" rx="14" fill="#FFF1D7"/>
    <text x="868" y="395" text-anchor="middle" class="tag">InteractivePage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="250" width="120" height="158" rx="24" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="1060" y="296" text-anchor="middle" class="label">关于</text>
    <text x="1060" y="330" text-anchor="middle" class="small">主题</text>
    <text x="1060" y="356" text-anchor="middle" class="small">说明</text>
    <rect x="1022" y="376" width="76" height="28" rx="14" fill="#FFF1D7"/>
    <text x="1060" y="395" text-anchor="middle" class="tag">About</text>
  </g>

  <path d="M600 180V220" stroke="#A8643D" stroke-width="3"/>
  <path d="M178 220H1060" stroke="#A8643D" stroke-width="3"/>
  <path d="M178 220V250M408 220V250M638 220V250M868 220V250M1060 220V250" stroke="#A8643D" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="144" y="506" width="912" height="116" rx="28" fill="#572B20"/>
    <text x="206" y="552" class="num">16</text>
    <text x="250" y="552" class="small" fill="#FFE8BF">非遗项目</text>
    <text x="430" y="552" class="num">16</text>
    <text x="474" y="552" class="small" fill="#FFE8BF">州市地图信息</text>
    <text x="690" y="552" class="num">9</text>
    <text x="724" y="552" class="small" fill="#FFE8BF">传承人物</text>
    <text x="876" y="552" class="num">4</text>
    <text x="910" y="552" class="small" fill="#FFE8BF">互动游戏</text>
    <line x1="360" y1="524" x2="360" y2="584" stroke="#B97B4D"/>
    <line x1="620" y1="524" x2="620" y2="584" stroke="#B97B4D"/>
    <line x1="812" y1="524" x2="812" y2="584" stroke="#B97B4D"/>
    <text x="600" y="594" text-anchor="middle" class="subtitle">内容组织：地图空间化 + 项目知识化 + 故事叙事化 + 游戏体验化</text>
  </g>
</svg>
