<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#F1DEC0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6C351F" flood-opacity=".14"/></filter>
    <style>
      .title{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:34px;font-weight:800;fill:#4B2419}
      .sub{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;fill:#7B5946}
      .layer{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:22px;font-weight:800;fill:#fff}
      .node{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:17px;font-weight:800;fill:#4B2419}
      .note{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:13px;fill:#7B5946}
      .caption{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:14px;font-weight:700;fill:#8F3E26}
    </style>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="600" y="66" text-anchor="middle" class="title">系统技术架构</text>
  <text x="600" y="96" text-anchor="middle" class="sub">以 Flutter 页面层为核心，组件复用与本地数据共同支撑非遗展示和交互体验</text>

  <g filter="url(#shadow)">
    <rect x="86" y="134" width="1028" height="104" rx="26" fill="#5A2C21"/>
    <text x="132" y="194" class="layer">表现层</text>
    <rect x="278" y="158" width="190" height="56" rx="18" fill="#FFF7E9"/><text x="373" y="181" text-anchor="middle" class="node">Material 3 主题</text><text x="373" y="202" text-anchor="middle" class="note">色彩 · 卡片 · 表单</text>
    <rect x="506" y="158" width="190" height="56" rx="18" fill="#FFF7E9"/><text x="601" y="181" text-anchor="middle" class="node">响应式导航</text><text x="601" y="202" text-anchor="middle" class="note">宽屏 Rail / 窄屏 Tab</text>
    <rect x="734" y="158" width="246" height="56" rx="18" fill="#FFF7E9"/><text x="857" y="181" text-anchor="middle" class="node">视觉与交互反馈</text><text x="857" y="202" text-anchor="middle" class="note">渐变 · 阴影 · 游戏结算</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="278" width="1028" height="116" rx="26" fill="#A7442B"/>
    <text x="132" y="345" class="layer">页面层</text>
    <rect x="244" y="304" width="142" height="64" rx="18" fill="#FFF7E9"/><text x="315" y="329" text-anchor="middle" class="node">首页</text><text x="315" y="351" text-anchor="middle" class="note">HomePage</text>
    <rect x="414" y="304" width="142" height="64" rx="18" fill="#FFF7E9"/><text x="485" y="329" text-anchor="middle" class="node">项目库</text><text x="485" y="351" text-anchor="middle" class="note">CulturePage</text>
    <rect x="584" y="304" width="142" height="64" rx="18" fill="#FFF7E9"/><text x="655" y="329" text-anchor="middle" class="node">传承故事</text><text x="655" y="351" text-anchor="middle" class="note">InheritorPage</text>
    <rect x="754" y="304" width="142" height="64" rx="18" fill="#FFF7E9"/><text x="825" y="329" text-anchor="middle" class="node">互动体验</text><text x="825" y="351" text-anchor="middle" class="note">InteractivePage</text>
    <rect x="924" y="304" width="124" height="64" rx="18" fill="#FFF7E9"/><text x="986" y="329" text-anchor="middle" class="node">关于</text><text x="986" y="351" text-anchor="middle" class="note">AboutPage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="434" width="1028" height="104" rx="26" fill="#C8753F"/>
    <text x="132" y="494" class="layer">组件层</text>
    <rect x="276" y="458" width="210" height="56" rx="18" fill="#FFF7E9"/><text x="381" y="481" text-anchor="middle" class="node">YunnanMapWidget</text><text x="381" y="502" text-anchor="middle" class="note">地图绘制与区域点击</text>
    <rect x="524" y="458" width="190" height="56" rx="18" fill="#FFF7E9"/><text x="619" y="481" text-anchor="middle" class="node">HeritageImage</text><text x="619" y="502" text-anchor="middle" class="note">图片加载与容错</text>
    <rect x="752" y="458" width="218" height="56" rx="18" fill="#FFF7E9"/><text x="861" y="481" text-anchor="middle" class="node">FallbackMap</text><text x="861" y="502" text-anchor="middle" class="note">网络失败备用展示</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="86" y="578" width="1028" height="86" rx="26" fill="#F8E8CE" stroke="#D6A35F"/>
    <text x="132" y="629" class="caption">数据与资源层</text>
    <rect x="290" y="596" width="220" height="50" rx="17" fill="#5A2C21"/><text x="400" y="626" text-anchor="middle" class="layer" style="font-size:16px">mock_data.dart</text>
    <rect x="548" y="596" width="220" height="50" rx="17" fill="#5A2C21"/><text x="658" y="626" text-anchor="middle" class="layer" style="font-size:16px">assets/images</text>
    <rect x="806" y="596" width="220" height="50" rx="17" fill="#5A2C21"/><text x="916" y="626" text-anchor="middle" class="layer" style="font-size:16px">Aliyun GeoJSON</text>
  </g>

  <path d="M600 238V278M600 394V434M600 538V578" stroke="#7D432C" stroke-width="4" stroke-linecap="round"/>
</svg>
