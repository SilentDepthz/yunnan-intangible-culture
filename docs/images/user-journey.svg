    <circle cx="112" cy="412" r="25" fill="#7E3525"/><text x="112" y="421" text-anchor="middle" class="num">1</text>
    <text x="170" y="414" text-anchor="middle" class="step">初识平台</text>
    <text x="170" y="448" text-anchor="middle" class="desc">首页主题视觉</text>
    <text x="170" y="474" text-anchor="middle" class="desc">推荐轮播与数据概览</text>
  </g>

