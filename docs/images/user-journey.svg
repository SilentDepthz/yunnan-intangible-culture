    <circle cx="542" cy="390" r="25" fill="#B7462A"/><text x="542" y="399" text-anchor="middle" class="num">3</text>
    <text x="600" y="392" text-anchor="middle" class="step">项目检索</text>
    <text x="600" y="426" text-anchor="middle" class="desc">分类筛选与搜索</text>
    <text x="600" y="452" text-anchor="middle" class="desc">打开详情理解工艺</text>
  </g>

