<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#F3DFC0"/></linearGradient>
    <linearGradient id="ribbon" x1="88" y1="104" x2="1112" y2="500"><stop stop-color="#8D3D28"/><stop offset=".52" stop-color="#C15935"/><stop offset="1" stop-color="#5B2B20"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6C351F" flood-opacity=".16"/></filter>
    <style>
      .title{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:34px;font-weight:800;fill:#4B2419}
      .sub{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;fill:#7B5946}
      .step{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:21px;font-weight:800;fill:#4B2419}
      .desc{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:14px;fill:#6C4D3B}
      .num{font-family:Georgia,serif;font-size:25px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" class="title">用户文化探索旅程</text>
  <text x="600" y="102" text-anchor="middle" class="sub">从首页认知到地图探索，再进入深度阅读与游戏化学习</text>

  <path d="M120 356C246 198 384 198 506 330C632 466 754 452 874 312C948 225 1032 214 1100 260" stroke="url(#ribbon)" stroke-width="22" stroke-linecap="round" opacity=".9"/>
  <path d="M120 356C246 198 384 198 506 330C632 466 754 452 874 312C948 225 1032 214 1100 260" stroke="#FFE7BA" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>

