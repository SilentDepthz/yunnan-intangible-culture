    <text x="374" y="154" text-anchor="middle" class="step">地图探索</text>
    <text x="374" y="188" text-anchor="middle" class="desc">点击云南州市</text>
    <text x="374" y="214" text-anchor="middle" class="desc">查看区域非遗信息</text>
  </g>

  <g filter="url(#shadow)">
