<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#F2DEC0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5A2C21"/>
      <stop offset="1" stop-color="#B7462A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B7462A"/>
      <stop offset="1" stop-color="#E3AA61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#6C351F" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10Z" fill="#8F3E26"/>
    </marker>
    <style>
      .title{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:42px;font-weight:800;fill:#432116}
      .subtitle{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:18px;fill:#7B5946}
      .h{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:25px;font-weight:800;fill:#432116}
      .h2{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:20px;font-weight:800;fill:#432116}
      .p{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#7B5946}
      .tag{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;font-weight:700;fill:#8F3E26}
      .white{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:22px;font-weight:800;fill:#fff}
      .whiteSmall{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;fill:#FFE8BF}
      .num{font-family:Georgia,serif;font-size:35px;font-weight:800;fill:#B7462A}
    </style>
  </defs>
  <rect width="1400" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1280" cy="110" r="105" fill="#E7C58D" opacity=".28"/>
  <circle cx="130" cy="790" r="145" fill="#B7462A" opacity=".07"/>
  <text x="700" y="74" text-anchor="middle" class="title">业务流程图</text>
  <text x="700" y="110" text-anchor="middle" class="subtitle">用户从进入首页到完成文化学习与互动体验的完整路径</text>
  
  <path d="M150 455C280 230 432 225 560 408C688 592 850 548 994 350C1066 250 1136 240 1240 295" stroke="#B7462A" stroke-width="22" stroke-linecap="round" opacity=".9"/>
  <path d="M150 455C280 230 432 225 560 408C688 592 850 548 994 350C1066 250 1136 240 1240 295" stroke="#FFE7BA" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 14"/>
  <g filter="url(#shadow)">
    <rect x="70" y="475" width="225" height="145" rx="26" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="182.5" y="517" text-anchor="middle" class="h2">1. 首页认知</text>
    <text x="182.5" y="551" text-anchor="middle" class="p">主题视觉</text>
<text x="182.5" y="577" text-anchor="middle" class="p">推荐轮播</text>
<text x="182.5" y="603" text-anchor="middle" class="p">数据概览</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="300" y="190" width="225" height="145" rx="26" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="412.5" y="232" text-anchor="middle" class="h2">2. 地图探索</text>
    <text x="412.5" y="266" text-anchor="middle" class="p">点击州市</text>
<text x="412.5" y="292" text-anchor="middle" class="p">查看区域非遗</text>
<text x="412.5" y="318" text-anchor="middle" class="p">空间化理解</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="545" y="465" width="225" height="145" rx="26" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="657.5" y="507" text-anchor="middle" class="h2">3. 项目检索</text>
    <text x="657.5" y="541" text-anchor="middle" class="p">搜索筛选</text>
<text x="657.5" y="567" text-anchor="middle" class="p">查看详情</text>
<text x="657.5" y="593" text-anchor="middle" class="p">理解工艺流程</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="790" y="190" width="225" height="145" rx="26" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="902.5" y="232" text-anchor="middle" class="h2">4. 故事阅读</text>
    <text x="902.5" y="266" text-anchor="middle" class="p">传承人物</text>
<text x="902.5" y="292" text-anchor="middle" class="p">成就资料</text>
<text x="902.5" y="318" text-anchor="middle" class="p">文化叙事</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1035" y="360" width="225" height="145" rx="26" fill="#FFFDF8" stroke="#D7B06E" stroke-width="1.5"/>
    <text x="1147.5" y="402" text-anchor="middle" class="h2">5. 游戏体验</text>
    <text x="1147.5" y="436" text-anchor="middle" class="p">拼图配对</text>
<text x="1147.5" y="462" text-anchor="middle" class="p">工序复原</text>
<text x="1147.5" y="488" text-anchor="middle" class="p">寻踪结算</text>
  </g>
  <rect x="250" y="690" width="900" height="72" rx="24" fill="url(#dark)" filter="url(#shadow)"/>
  <text x="700" y="721" text-anchor="middle" class="white">业务闭环</text>
  <text x="700" y="750" text-anchor="middle" class="whiteSmall">浏览认知 → 地图定位 → 内容学习 → 传承理解 → 游戏巩固</text>
  
</svg>